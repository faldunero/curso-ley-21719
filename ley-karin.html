<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ley Karin - Capacitación en Acoso Laboral</title>
    <script crossorigin src="https://unpkg.com/react@19/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@19/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        .header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 15px 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }

        .logo-text h2 {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
        }

        .logo-text p {
            font-size: 12px;
            color: #64748b;
            margin: 2px 0 0 0;
        }

        .nav {
            display: flex;
            gap: 30px;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: #475569;
            transition: color 0.3s;
            padding: 8px 0;
        }

        .nav-btn.active {
            color: #dc2626;
        }

        .nav-btn:hover {
            color: #dc2626;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-left: 30px;
            border-left: 1px solid #e2e8f0;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .user-info h3 {
            font-size: 13px;
            font-weight: 600;
            margin: 0;
        }

        .user-info p {
            font-size: 12px;
            color: #64748b;
            margin: 2px 0 0 0;
        }

        /* Main Content */
        .main-content {
            min-height: calc(100vh - 120px);
            padding: 40px 0;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, #fef2f2 0%, #fff7ed 100%);
            padding: 60px 0;
            margin-bottom: 40px;
            border-radius: 16px;
            border: 1px solid #fecaca;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 16px;
            color: #dc2626;
        }

        .hero > div > p:first-of-type {
            font-size: 18px;
            color: #64748b;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .hero > div > p:last-of-type {
            font-size: 16px;
            color: #475569;
            margin-bottom: 32px;
            line-height: 1.8;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .hero-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #fecaca;
            text-align: center;
        }

        .hero-card-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .hero-card h3 {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .hero-card p {
            font-size: 13px;
            color: #64748b;
        }

        /* Progress Card */
        .progress-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 600;
            color: #1e293b;
        }

        .progress-percent {
            font-size: 14px;
            font-weight: 700;
            color: #dc2626;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #dc2626 0%, #991b1b 100%);
            transition: width 0.3s;
        }

        .progress-text {
            font-size: 13px;
            color: #64748b;
        }

        /* Modules Grid */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .module-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .module-card:hover:not(.completed) {
            border-color: #dc2626;
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.1);
        }

        .module-card.completed {
            background: #f0fdf4;
            border-color: #10b981;
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .module-icon-title {
            display: flex;
            gap: 12px;
            flex: 1;
        }

        .module-icon {
            font-size: 32px;
            min-width: 32px;
        }

        .module-title-section h3 {
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .module-time {
            font-size: 12px;
            color: #64748b;
        }

        .checkmark {
            font-size: 24px;
            color: #10b981;
        }

        .module-desc {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .module-action {
            display: flex;
        }

        .btn-secondary {
            flex: 1;
            padding: 10px 16px;
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(220, 38, 38, 0.2);
        }

        .completed-badge {
            flex: 1;
            padding: 10px 16px;
            background: #ecfdf5;
            color: #10b981;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
        }

        /* Exam */
        .exam-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 32px;
            margin-bottom: 24px;
            transition: all 0.3s;
        }

        .exam-card.active {
            border-color: #dc2626;
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.1);
        }

        .exam-question {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #1e293b;
        }

        .exam-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .option-label:hover {
            border-color: #dc2626;
            background: #fef2f2;
        }

        .option-label.selected {
            border-color: #dc2626;
            background: #ffe4e6;
        }

        .option-label input[type="radio"] {
            margin-right: 12px;
            cursor: pointer;
        }

        /* Results */
        .result-container {
            text-align: center;
            padding: 60px 40px;
            border-radius: 16px;
            margin-bottom: 40px;
        }

        .result-icon {
            font-size: 80px;
            margin-bottom: 24px;
        }

        .result-passed {
            background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
            border: 2px solid #10b981;
        }

        .result-failed {
            background: linear-gradient(135deg, #fef2f2 0%, #fef2f2 100%);
            border: 2px solid #dc2626;
        }

        .result-title {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .result-passed .result-title {
            color: #10b981;
        }

        .result-failed .result-title {
            color: #dc2626;
        }

        .result-score {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 32px;
        }

        .result-passed .result-score {
            color: #10b981;
        }

        .result-failed .result-score {
            color: #dc2626;
        }

        /* Certificate */
        .certificate {
            background: white;
            border: 2px solid #fbbf24;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 24px;
            text-align: center;
        }

        .cert-icon {
            font-size: 64px;
            color: #f59e0b;
            margin-bottom: 20px;
        }

        .cert-title {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .cert-subtitle {
            color: #64748b;
            margin-bottom: 24px;
        }

        .cert-content {
            background: linear-gradient(135deg, #fef2f2 0%, #fff7ed 100%);
            padding: 32px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid #fecaca;
        }

        .cert-name {
            font-size: 24px;
            font-weight: 700;
            color: #dc2626;
            margin-bottom: 12px;
        }

        .cert-email {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .cert-achievement {
            font-size: 14px;
            line-height: 1.8;
            color: #1e293b;
        }

        .cert-date {
            font-size: 12px;
            color: #64748b;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #fecaca;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 16px;
            margin-top: 32px;
        }

        .btn-group button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 15px;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            color: white;
            font-size: 16px;
            padding: 16px 32px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(220, 38, 38, 0.2);
        }

        .btn-gray {
            background: #64748b;
            color: white;
        }

        .btn-gray:hover {
            background: #475569;
        }

        .view-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 1000;
        }

        .toggle-btn {
            padding: 8px 12px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .toggle-btn.active {
            background: #dc2626;
            color: white;
            border-color: #dc2626;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .modules-grid {
                grid-template-columns: 1fr;
            }

            .hero-content {
                grid-template-columns: 1fr;
            }

            .nav {
                gap: 16px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .hero-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 16px;
            }

            .nav {
                flex-direction: column;
                gap: 8px;
            }

            .user-profile {
                border-left: none;
                border-top: 1px solid #e2e8f0;
                padding-left: 0;
                padding-top: 16px;
                width: 100%;
            }

            .hero {
                padding: 32px 24px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .view-toggle {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            // AUTENTICACIÓN FUTURA: Agregar verificación de usuario
            // const currentUser = { id: '123', name: 'Felipe', email: 'faldunate@gmail.com', role: 'estudiante' };
            // TODO: Verificar si el usuario tiene acceso a este curso
            // TODO: Cargar progreso desde base de datos
            // TODO: Guardar progreso en tiempo real

            const [currentPage, setCurrentPage] = useState('inicio');
            const [viewMode, setViewMode] = useState('desktop');
            const [completedModules, setCompletedModules] = useState([]);
            const [examAnswers, setExamAnswers] = useState({});
            const [examSubmitted, setExamSubmitted] = useState(false);
            const [examScore, setExamScore] = useState(0);

            const modules = [
                {
                    id: 1,
                    title: 'Introducción a la Ley Karin',
                    duration: '15 min',
                    icon: '📚',
                    content: 'Conoce los fundamentos de la Ley 21.643 sobre acoso y violencia laboral, su historia y objetivos principales.'
                },
                {
                    id: 2,
                    title: 'Derechos y Protecciones',
                    duration: '18 min',
                    icon: '🛡️',
                    content: 'Explora los derechos fundamentales de los trabajadores contra el acoso y violencia laboral.'
                },
                {
                    id: 3,
                    title: 'Identificación del Acoso',
                    duration: '20 min',
                    icon: '🔍',
                    content: 'Aprende a identificar las diferentes formas de acoso, violencia laboral y sus señales de alerta.'
                },
                {
                    id: 4,
                    title: 'Procedimientos de Denuncia',
                    duration: '18 min',
                    icon: '📋',
                    content: 'Conoce los pasos para hacer una denuncia interna o externa ante instituciones competentes.'
                },
                {
                    id: 5,
                    title: 'Responsabilidades Empresariales',
                    duration: '17 min',
                    icon: '⚙️',
                    content: 'Entiende las obligaciones de las empresas en prevención y atención del acoso laboral.'
                },
                {
                    id: 6,
                    title: 'Sanciones y Consecuencias',
                    duration: '15 min',
                    icon: '⚖️',
                    content: 'Descubre las sanciones legales y consecuencias por violación de la Ley Karin.'
                }
            ];

            // AUTENTICACIÓN FUTURA: Cargar preguntas desde base de datos
            // const examQuestions = await fetchExamQuestions('karin');
            const examQuestions = [
                {
                    id: 1,
                    question: '¿Cuál es el nombre oficial de la Ley Karin?',
                    options: ['Ley de Protección de Datos', 'Ley 21.643 de Acoso y Violencia Laboral', 'Ley de Negociación Colectiva', 'Ley de Seguridad Social'],
                    correct: 1
                },
                {
                    id: 2,
                    question: '¿Qué define como acoso laboral la Ley Karin?',
                    options: ['Solo insultos verbales', 'Conducta abusiva que atenta contra dignidad del trabajador', 'Diferencias de opinión laboral', 'Cambios en horarios de trabajo'],
                    correct: 1
                },
                {
                    id: 3,
                    question: 'Un gerente excluye constantemente a un trabajador de reuniones sin justificación y lo ignora. ¿Es esto acoso?',
                    options: ['No, es decisión gerencial', 'Sí, es acoso laboral por exclusión', 'Depende del contrato', 'No afecta la dignidad'],
                    correct: 1
                },
                {
                    id: 4,
                    question: '¿A quién se debe reportar una denuncia de acoso laboral inicialmente?',
                    options: ['Solo a la Inspección del Trabajo', 'Primero a la empresa o sus representantes', 'Solo al Tribunal del Trabajo', 'A Carabineros'],
                    correct: 1
                },
                {
                    id: 5,
                    question: '¿Cuál es la obligación principal de las empresas según la Ley Karin?',
                    options: ['Tolerar el acoso moderado', 'Implementar medidas de prevención y protección', 'Ocultar denuncias', 'No investigar denuncias'],
                    correct: 1
                },
                {
                    id: 6,
                    question: '¿Qué sanción puede aplicarse a una empresa por incumplimiento de la Ley Karin?',
                    options: ['Amonestación verbal', 'Multas de hasta 100 UF', 'Sin sanciones', 'Reducción de impuestos'],
                    correct: 1
                },
                {
                    id: 7,
                    question: 'Un jefe hace comentarios ofensivos sobre la apariencia física de un empleado repetidamente. ¿Es acoso?',
                    options: ['No, son bromas', 'Sí, es acoso que afecta dignidad', 'Solo si es diario', 'No sin testigos'],
                    correct: 1
                },
                {
                    id: 8,
                    question: '¿Puede un trabajador ser despedido por denunciar acoso laboral?',
                    options: ['Sí, libremente', 'No, hay protección contra represalias', 'Solo después de 30 días', 'Depende de la empresa'],
                    correct: 1
                }
            ];

            const handleCompleteModule = (moduleId) => {
                if (!completedModules.includes(moduleId)) {
                    setCompletedModules([...completedModules, moduleId]);
                    // AUTENTICACIÓN FUTURA: Guardar progreso en base de datos
                    // await saveProgress(currentUser.id, 'karin', moduleId);
                }
            };

            const handleExamAnswer = (questionId, answerIndex) => {
                setExamAnswers({ ...examAnswers, [questionId]: answerIndex });
            };

            const handleSubmitExam = () => {
                let score = 0;
                examQuestions.forEach(q => {
                    if (examAnswers[q.id] === q.correct) score++;
                });
                setExamScore(score);
                setExamSubmitted(true);
                // AUTENTICACIÓN FUTURA: Guardar calificación y generar certificado
                // await saveCertificate(currentUser.id, 'karin', score, isPassed);
            };

            const progressPercentage = (completedModules.length / modules.length) * 100;
            const isPassed = examScore >= 6; // Mínimo 6 de 8 preguntas (75%)

            return (
                <>
                    <div className="view-toggle">
                        <button className={`toggle-btn ${viewMode === 'desktop' ? 'active' : ''}`} onClick={() => setViewMode('desktop')}>💻 Desktop</button>
                        <button className={`toggle-btn ${viewMode === 'mobile' ? 'active' : ''}`} onClick={() => setViewMode('mobile')}>📱 Mobile</button>
                    </div>

                    <header className="header">
                        <div className="container">
                            <div className="header-content">
                                <div className="logo">
                                    <div className="logo-icon">K</div>
                                    <div className="logo-text">
                                        <h2>AFAN Learning</h2>
                                        <p>Ley Karin - Acoso Laboral</p>
                                    </div>
                                </div>
                                <div className="nav">
                                    <button className={`nav-btn ${currentPage === 'inicio' ? 'active' : ''}`} onClick={() => setCurrentPage('inicio')}>Inicio</button>
                                    <button className={`nav-btn ${currentPage === 'cursos' ? 'active' : ''}`} onClick={() => setCurrentPage('cursos')}>Mis Cursos</button>
                                    <button className={`nav-btn ${currentPage === 'examen' ? 'active' : ''}`} onClick={() => setCurrentPage('examen')}>Examen</button>
                                </div>
                                <div className="user-profile">
                                    <div className="user-avatar">FA</div>
                                    <div className="user-info">
                                        <h3>Felipe Aldunate</h3>
                                        <p>faldunate@gmail.com</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="main-content">
                        <div className="container">
                            {currentPage === 'inicio' && (
                                <>
                                    <div className="hero">
                                        <div className="hero-content">
                                            <div>
                                                <h1>Ley Karin</h1>
                                                <p>Ley 21.643</p>
                                                <p>Aprende sobre la protección contra acoso y violencia laboral en Chile. Desarrolla competencias para identificar, denunciar y prevenir el acoso en el ambiente laboral.</p>
                                                <button className="btn-primary" onClick={() => setCurrentPage('cursos')}>Comenzar Ahora →</button>
                                            </div>
                                            <div className="hero-grid">
                                                <div className="hero-card">
                                                    <div className="hero-card-icon">⏱️</div>
                                                    <h3>90 minutos</h3>
                                                    <p>de contenido</p>
                                                </div>
                                                <div className="hero-card">
                                                    <div className="hero-card-icon">🏆</div>
                                                    <h3>Certificado</h3>
                                                    <p>digital</p>
                                                </div>
                                                <div className="hero-card">
                                                    <div className="hero-card-icon">✓</div>
                                                    <h3>6 Módulos</h3>
                                                    <p>estructurados</p>
                                                </div>
                                                <div className="hero-card">
                                                    <div className="hero-card-icon">🌐</div>
                                                    <h3>100% Online</h3>
                                                    <p>a tu ritmo</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </>
                            )}

                            {currentPage === 'cursos' && (
                                <>
                                    <h2 style={{fontSize: '28px', marginBottom: '8px'}}>Mis Cursos</h2>
                                    <p style={{color: '#64748b', marginBottom: '32px'}}>Completa todos los módulos para acceder al examen final</p>

                                    <div className="progress-card">
                                        <div className="progress-header">
                                            <span>Progreso General</span>
                                            <span className="progress-percent">{Math.round(progressPercentage)}%</span>
                                        </div>
                                        <div className="progress-bar">
                                            <div className="progress-fill" style={{width: `${progressPercentage}%`}}></div>
                                        </div>
                                        <div className="progress-text">{completedModules.length} de {modules.length} módulos completados</div>
                                    </div>

                                    <div className="modules-grid">
                                        {modules.map(module => (
                                            <div key={module.id} className={`module-card ${completedModules.includes(module.id) ? 'completed' : ''}`}>
                                                <div className="module-header">
                                                    <div className="module-icon-title">
                                                        <div className="module-icon">{module.icon}</div>
                                                        <div className="module-title-section">
                                                            <h3>{module.title}</h3>
                                                            <div className="module-time">⏱️ {module.duration}</div>
                                                        </div>
                                                    </div>
                                                    {completedModules.includes(module.id) && <div className="checkmark">✓</div>}
                                                </div>
                                                <div className="module-desc">{module.content}</div>
                                                <div className="module-action">
                                                    {!completedModules.includes(module.id) ? (
                                                        <button className="btn-secondary" onClick={() => handleCompleteModule(module.id)}>Ver Módulo →</button>
                                                    ) : (
                                                        <span className="completed-badge">✓ Completado</span>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {completedModules.length === modules.length && (
                                        <div style={{background: 'linear-gradient(135deg, #10b981 0%, #059669 100%)', color: 'white', padding: '32px', borderRadius: '16px', textAlign: 'center', marginTop: '40px'}}>
                                            <p style={{marginBottom: '16px', fontSize: '16px'}}>¡Felicidades! Has completado todos los módulos</p>
                                            <button className="btn-primary" style={{background: 'white', color: '#10b981'}} onClick={() => setCurrentPage('examen')}>Realizar Examen Final →</button>
                                        </div>
                                    )}
                                </>
                            )}

                            {currentPage === 'examen' && !examSubmitted && (
                                <>
                                    <div className="progress-card">
                                        <h2 style={{marginBottom: '8px'}}>Examen Final</h2>
                                        <p>Responde correctamente al menos 6 de 8 preguntas (75%) para aprobar</p>
                                    </div>

                                    <div style={{marginBottom: '32px'}}>
                                        {examQuestions.map((q, idx) => (
                                            <div key={q.id} className={`exam-card ${Object.keys(examAnswers).includes(String(q.id)) ? 'active' : ''}`}>
                                                <div className="exam-question">{idx + 1}. {q.question}</div>
                                                <div className="exam-options">
                                                    {q.options.map((option, optIdx) => (
                                                        <label key={optIdx} className={`option-label ${examAnswers[q.id] === optIdx ? 'selected' : ''}`}>
                                                            <input type="radio" name={`q${q.id}`} value={optIdx} checked={examAnswers[q.id] === optIdx} onChange={() => handleExamAnswer(q.id, optIdx)} />
                                                            <span>{option}</span>
                                                        </label>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="btn-group">
                                        <button className="btn-gray" onClick={() => setCurrentPage('cursos')}>← Volver</button>
                                        <button className="btn-secondary" onClick={handleSubmitExam} disabled={Object.keys(examAnswers).length < 8} style={{opacity: Object.keys(examAnswers).length < 8 ? 0.5 : 1}}>Enviar Examen →</button>
                                    </div>
                                </>
                            )}

                            {currentPage === 'examen' && examSubmitted && (
                                <>
                                    <div className={`result-container ${isPassed ? 'result-passed' : 'result-failed'}`} style={{borderRadius: '16px', marginBottom: '40px'}}>
                                        <div className="result-icon">{isPassed ? '🎉' : '📋'}</div>
                                        <h1 className="result-title">{isPassed ? '¡Aprobado!' : 'No Aprobado'}</h1>
                                        <div className="result-score">{examScore} de 8 preguntas correctas ({Math.round((examScore/8)*100)}%)</div>
                                    </div>

                                    {isPassed && (
                                        <>
                                            <div className="certificate">
                                                <div className="cert-icon">🏆</div>
                                                <h2 className="cert-title">Certificado de Aprobación</h2>
                                                <p className="cert-subtitle">Protección contra Acoso y Violencia Laboral - Ley Karin</p>
                                                <div className="cert-content">
                                                    <div className="cert-name">Felipe Aldunate</div>
                                                    <div className="cert-email">faldunate@gmail.com</div>
                                                    <div className="cert-achievement">
                                                        <p>Ha completado exitosamente el curso de</p>
                                                        <p style={{fontWeight: '600'}}>Protección contra Acoso y Violencia Laboral - Ley Karin (Ley 21.643)</p>
                                                    </div>
                                                    <div className="cert-date">
                                                        <p>Emitido: {new Date().toLocaleDateString('es-CL')}</p>
                                                        <p style={{fontSize: '11px', marginTop: '4px'}}>ID: CERT-{new Date().getFullYear()}-{String(new Date().getMonth() + 1).padStart(2, '0')}{String(new Date().getDate()).padStart(2, '0')}-002</p>
                                                    </div>
                                                </div>
                                                <button className="btn-secondary" style={{width: '100%', marginBottom: '16px'}}>📥 Descargar Certificado PDF</button>
                                            </div>
                                        </>
                                    )}

                                    <div className="btn-group">
                                        <button className="btn-gray" style={{flex: 1}} onClick={() => { setCurrentPage('inicio'); setCompletedModules([]); setExamAnswers({}); setExamSubmitted(false); }}>← Volver al Inicio</button>
                                        <button className="btn-secondary" style={{flex: 1}} onClick={() => window.location.href = 'landing.html'}>↩️ Volver a Cursos</button>
                                    </div>
                                </>
                            )}
                        </div>
                    </main>
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
