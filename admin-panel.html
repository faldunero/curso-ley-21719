<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - AFAN Learning</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 20px 0;
            margin-bottom: 40px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }

        .logo-text h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .logo-text p {
            font-size: 12px;
            color: #64748b;
        }

        .section {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 32px;
            margin-bottom: 24px;
        }

        .section h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #1e293b;
        }

        .feature-list {
            list-style: none;
        }

        .feature-list li {
            padding: 12px 0;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .feature-list li:last-child {
            border-bottom: none;
        }

        .feature-icon {
            font-size: 20px;
        }

        .feature-text {
            flex: 1;
        }

        .feature-text h4 {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .feature-text p {
            font-size: 13px;
            color: #64748b;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            background: #fef3c7;
            color: #d97706;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.complete {
            background: #ecfdf5;
            color: #059669;
        }

        .code-block {
            background: #1e293b;
            color: #cbd5e1;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            margin-top: 12px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 16px;
        }

        .btn:hover {
            background: #1e40af;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // Admin Panel - Vanilla JS
        // TODO: Add authentication and database integration

        function initAdminPanel() {
            const root = document.getElementById('root');

            let html = '';

            // Header
            html += '<header class="header">';
            html += '<div class="container">';
            html += '<div class="header-content">';
            html += '<div class="logo">';
            html += '<div class="logo-icon">A</div>';
            html += '<div class="logo-text">';
            html += '<h2>AFAN Learning</h2>';
            html += '<p>Panel de Administración</p>';
            html += '</div>';
            html += '</div>';
            html += '</div>';
            html += '</div>';
            html += '</header>';

            // Main content
            html += '<main>';
            html += '<div class="container">';

            // Section 1: Panel status
            html += '<div class="section">';
            html += '<h2>Panel de Administración - En Desarrollo</h2>';
            html += '<p>Este panel está en construcción y pronto estará disponible con las siguientes funcionalidades:</p>';
            html += '<ul class="feature-list">';

            const features = [
                { icon: '👥', title: 'Gestión de Usuarios', desc: 'Crear, editar y gestionar usuarios, roles y permisos de acceso a cursos' },
                { icon: '📚', title: 'Gestión de Cursos', desc: 'Crear, editar, publicar y archivar cursos. Gestionar módulos y contenido' },
                { icon: '📊', title: 'Reportes y Estadísticas', desc: 'Ver progreso de estudiantes, tasas de aprobación y desempeño general' },
                { icon: '🔐', title: 'Gestión de Acceso', desc: 'Controlar qué cursos pueden ver y acceder los usuarios según su rol' },
                { icon: '📝', title: 'Gestión de Certificados', desc: 'Generar, verificar y revocar certificados de los estudiantes' }
            ];

            features.forEach(feature => {
                html += '<li>';
                html += '<div class="feature-icon">' + feature.icon + '</div>';
                html += '<div class="feature-text">';
                html += '<h4>' + feature.title + '</h4>';
                html += '<p>' + feature.desc + '</p>';
                html += '<span class="status-badge">Planificado</span>';
                html += '</div>';
                html += '</li>';
            });

            html += '</ul>';
            html += '</div>';

            // Section 2: Integrations
            html += '<div class="section">';
            html += '<h2>Próximas Integraciones</h2>';
            html += '<ul class="feature-list">';

            const integrations = [
                { icon: '🗄️', title: 'Base de Datos - Supabase/Firebase', desc: 'Almacenamiento de usuarios, progreso y certificados' },
                { icon: '🔑', title: 'Autenticación', desc: 'Sistema de login, registro y gestión de sesiones' },
                { icon: '📧', title: 'Notificaciones por Email', desc: 'Confirmación de certificados, recordatorios de cursos pendientes' },
                { icon: '🎓', title: 'Sistema de Certificados PDF', desc: 'Generación automática de certificados descargables' }
            ];

            integrations.forEach(item => {
                html += '<li>';
                html += '<div class="feature-icon">' + item.icon + '</div>';
                html += '<div class="feature-text">';
                html += '<h4>' + item.title + '</h4>';
                html += '<p>' + item.desc + '</p>';
                html += '<span class="status-badge">Planificado</span>';
                html += '</div>';
                html += '</li>';
            });

            html += '</ul>';
            html += '</div>';

            // Section 3: Database structure
            html += '<div class="section">';
            html += '<h2>Estructura de Base de Datos Preparada</h2>';
            html += '<p>Las siguientes tablas están listas para ser implementadas con Supabase o Firebase:</p>';

            html += '<h3 style="margin-top: 24px; margin-bottom: 12px;">Usuarios</h3>';
            html += '<div class="code-block">{<br>';
            html += '  id: \'uuid\',<br>';
            html += '  email: \'usuario@example.com\',<br>';
            html += '  name: \'Nombre Completo\',<br>';
            html += '  role: \'estudiante|admin|instructor\',<br>';
            html += '  coursesAvailable: [\'21719\', \'karin\'],<br>';
            html += '  createdAt: \'timestamp\',<br>';
            html += '  updatedAt: \'timestamp\'<br>';
            html += '}</div>';

            html += '<h3 style="margin-top: 24px; margin-bottom: 12px;">Cursos</h3>';
            html += '<div class="code-block">{<br>';
            html += '  id: \'21719\',<br>';
            html += '  title: \'Ley de Protección de Datos\',<br>';
            html += '  description: \'...\',<br>';
            html += '  modules: 5,<br>';
            html += '  status: \'published|draft\',<br>';
            html += '  createdBy: \'admin-id\',<br>';
            html += '  createdAt: \'timestamp\'<br>';
            html += '}</div>';

            html += '<h3 style="margin-top: 24px; margin-bottom: 12px;">Progreso</h3>';
            html += '<div class="code-block">{<br>';
            html += '  userId: \'uuid\',<br>';
            html += '  courseId: \'21719\',<br>';
            html += '  modulesCompleted: [\'mod1\', \'mod2\'],<br>';
            html += '  score: 86,<br>';
            html += '  certificateDownloaded: true,<br>';
            html += '  updatedAt: \'timestamp\'<br>';
            html += '}</div>';

            html += '</div>';

            // Section 4: Navigation
            html += '<div class="section">';
            html += '<h2>Navegación Rápida</h2>';
            html += '<a href="index.html" class="btn">↩️ Volver al Curso</a>';
            html += '<a href="ley-21719.html" class="btn" style="margin-left: 12px;">📚 Ver Ley 21.719</a>';
            html += '<a href="ley-karin.html" class="btn" style="margin-left: 12px;">⚖️ Ver Ley Karin</a>';
            html += '</div>';

            html += '</div>';
            html += '</main>';

            root.innerHTML = html;
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initAdminPanel);
        } else {
            initAdminPanel();
        }
    </script>
</body>
</html>
