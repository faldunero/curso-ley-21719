<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ley 21.719 - Capacitación en Protección de Datos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        .header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            sticky: top;
            z-index: 100;
            padding: 15px 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 20px;
        }

        .logo-text h2 {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
        }

        .logo-text p {
            font-size: 12px;
            color: #64748b;
            margin: 2px 0 0 0;
        }

        .nav {
            display: flex;
            gap: 30px;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            color: #475569;
            transition: color 0.3s;
            padding: 8px 0;
        }

        .nav-btn.active {
            color: #2563eb;
        }

        .nav-btn:hover {
            color: #2563eb;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-left: 20px;
            border-left: 1px solid #e2e8f0;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .user-info h3 {
            font-size: 13px;
            font-weight: 600;
            margin: 0;
        }

        .user-info p {
            font-size: 11px;
            color: #64748b;
            margin: 2px 0 0 0;
        }

        /* Main Content */
        .main-content {
            padding: 40px 0;
        }

        .view-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            background: #1e293b;
            padding: 8px;
            border-radius: 8px;
            width: fit-content;
        }

        .toggle-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .toggle-btn.active {
            background: #2563eb;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white;
            padding: 60px 40px;
            border-radius: 16px;
            margin-bottom: 50px;
        }

        .hero-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .hero p {
            font-size: 18px;
            color: #dbeafe;
            margin-bottom: 24px;
        }

        .btn-primary {
            background: white;
            color: #2563eb;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-block;
        }

        .btn-primary:hover {
            background: #f1f5f9;
            transform: translateY(-2px);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .hero-card-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .hero-card h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .hero-card p {
            font-size: 13px;
            color: #dbeafe;
        }

        /* Modules Grid */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        .module-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 28px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .module-card:hover {
            border-color: #2563eb;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.1);
            transform: translateY(-4px);
        }

        .module-card.completed {
            background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
            border-color: #10b981;
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .module-icon-title {
            display: flex;
            gap: 16px;
        }

        .module-icon {
            font-size: 40px;
        }

        .module-title-section h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .module-time {
            font-size: 12px;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .checkmark {
            color: #10b981;
            font-size: 24px;
        }

        .module-desc {
            color: #475569;
            font-size: 14px;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .module-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-secondary {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: #1e40af;
        }

        .completed-badge {
            color: #10b981;
            font-weight: 600;
            font-size: 13px;
        }

        /* Progress Bar */
        .progress-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .progress-header span {
            font-weight: 600;
            color: #1e293b;
        }

        .progress-percent {
            font-size: 18px;
            font-weight: 700;
            color: #2563eb;
        }

        .progress-bar {
            background: #e2e8f0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-fill {
            background: linear-gradient(90deg, #2563eb 0%, #1e40af 100%);
            height: 100%;
            transition: width 0.3s;
        }

        .progress-text {
            font-size: 13px;
            color: #64748b;
        }

        /* Examen */
        .exam-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .exam-card.active {
            border: 2px solid #2563eb;
            background: #f0f9ff;
        }

        .exam-question {
            font-weight: 600;
            margin-bottom: 16px;
            color: #1e293b;
        }

        .exam-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .option-label:hover {
            border-color: #2563eb;
            background: #f0f9ff;
        }

        .option-label.selected {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .option-label input[type="radio"] {
            margin-right: 12px;
            cursor: pointer;
        }

        /* Results */
        .result-container {
            text-align: center;
            padding: 60px 40px;
        }

        .result-icon {
            font-size: 80px;
            margin-bottom: 24px;
        }

        .result-passed {
            background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
            border: 2px solid #10b981;
        }

        .result-failed {
            background: linear-gradient(135deg, #fef2f2 0%, #fef2f2 100%);
            border: 2px solid #ef4444;
        }

        .result-title {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .result-passed .result-title {
            color: #10b981;
        }

        .result-failed .result-title {
            color: #ef4444;
        }

        .result-score {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 32px;
        }

        .result-passed .result-score {
            color: #10b981;
        }

        .result-failed .result-score {
            color: #ef4444;
        }

        /* Certificate */
        .certificate {
            background: white;
            border: 2px solid #fbbf24;
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 24px;
            text-align: center;
        }

        .cert-icon {
            font-size: 64px;
            color: #f59e0b;
            margin-bottom: 20px;
        }

        .cert-title {
            font-size: 24px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .cert-subtitle {
            color: #64748b;
            margin-bottom: 24px;
        }

        .cert-content {
            background: linear-gradient(135deg, #f0f9ff 0%, #ecfdf5 100%);
            padding: 32px;
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid #bfdbfe;
        }

        .cert-name {
            font-size: 24px;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 12px;
        }

        .cert-email {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .cert-achievement {
            font-size: 14px;
            line-height: 1.8;
            color: #1e293b;
        }

        .cert-date {
            font-size: 12px;
            color: #64748b;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #bfdbfe;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 16px;
            margin-top: 32px;
        }

        .btn-group button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 15px;
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }

        .btn-secondary {
            background: #2563eb;
            color: white;
        }

        .btn-secondary:hover {
            background: #1e40af;
            transform: translateY(-2px);
        }

        .btn-gray {
            background: #64748b;
            color: white;
        }

        .btn-gray:hover {
            background: #475569;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .modules-grid {
                grid-template-columns: 1fr;
            }

            .hero-content {
                grid-template-columns: 1fr;
            }

            .nav {
                gap: 16px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .hero-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 16px;
            }

            .nav {
                flex-direction: column;
                gap: 8px;
            }

            .user-profile {
                border-left: none;
                border-top: 1px solid #e2e8f0;
                padding-left: 0;
                padding-top: 16px;
                width: 100%;
            }

            .hero {
                padding: 32px 24px;
            }

            .hero h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // State management
        let state = {
            currentPage: 'inicio',
            viewMode: 'desktop',
            completedModules: [],
            examAnswers: {},
            examSubmitted: false,
            examScore: 0
        };

        const modules = [
            {
                id: 1,
                title: 'Introducción a la Ley 21.719',
                duration: '15 min',
                icon: '📋',
                content: 'Conoce los fundamentos y objetivos de la Ley de Protección de Datos Personales en Chile.'
            },
            {
                id: 2,
                title: 'Derechos de los Titulares',
                duration: '20 min',
                icon: '👤',
                content: 'Explora los derechos fundamentales de las personas respecto a sus datos personales.'
            },
            {
                id: 3,
                title: 'Obligaciones de Responsables',
                duration: '25 min',
                icon: '⚖️',
                content: 'Comprende las responsabilidades de quienes recopilan y procesan datos personales.'
            },
            {
                id: 4,
                title: 'Seguridad y Privacidad',
                duration: '20 min',
                icon: '🔒',
                content: 'Aprende sobre medidas de protección y seguridad de datos personales.'
            },
            {
                id: 5,
                title: 'Cumplimiento Normativo',
                duration: '15 min',
                icon: '✅',
                content: 'Descubre cómo implementar medidas de cumplimiento en tu organización.'
            }
        ];

        const examQuestions = [
            {
                id: 1,
                question: '¿Cuál es el objetivo principal de la Ley 21.719?',
                options: ['Proteger los datos personales de los ciudadanos', 'Aumentar la recolección de datos', 'Eliminar la privacidad', 'Ninguna de las anteriores'],
                correct: 0
            },
            {
                id: 2,
                question: '¿Cuál es uno de los derechos fundamentales de los titulares?',
                options: ['El derecho de opresión', 'El derecho de acceso a sus datos', 'El derecho de destrucción', 'Ninguno'],
                correct: 1
            },
            {
                id: 3,
                question: '¿Quién es responsable de la seguridad?',
                options: ['Solo el gobierno', 'El responsable del tratamiento', 'Nadie', 'Solo los empleados'],
                correct: 1
            },
            {
                id: 4,
                question: '¿Qué hacer ante una brecha de datos?',
                options: ['Ocultar', 'Notificar a afectados', 'Eliminar registros', 'Seguir operando'],
                correct: 1
            },
            {
                id: 5,
                question: '¿Cuál es el fiscalizador?',
                options: ['Sernac', 'Sernanp', 'Dirección General de Protección', 'Superintendencia de Seguros'],
                correct: 2
            }
        ];

        function handleCompleteModule(moduleId) {
            if (!state.completedModules.includes(moduleId)) {
                state.completedModules.push(moduleId);
            }
            render();
        }

        function handleExamAnswer(questionId, answerIndex) {
            state.examAnswers[questionId] = answerIndex;
            render();
        }

        function handleSubmitExam() {
            let score = 0;
            examQuestions.forEach(q => {
                if (state.examAnswers[q.id] === q.correct) score++;
            });
            state.examScore = score;
            state.examSubmitted = true;
            render();
        }

        function render() {
            const root = document.getElementById('root');
            const progressPercentage = (state.completedModules.length / modules.length) * 100;
            const isPassed = state.examScore >= 4;
            const answeredCount = Object.keys(state.examAnswers).length;

            // Clear root
            root.innerHTML = '';

            // View toggle
            const toggle = document.createElement('div');
            toggle.className = 'view-toggle';
            toggle.innerHTML = `
                <button class="toggle-btn ${state.viewMode === 'desktop' ? 'active' : ''}">💻 Desktop</button>
                <button class="toggle-btn ${state.viewMode === 'mobile' ? 'active' : ''}">📱 Mobile</button>
            `;
            toggle.querySelectorAll('button')[0].onclick = () => { state.viewMode = 'desktop'; render(); };
            toggle.querySelectorAll('button')[1].onclick = () => { state.viewMode = 'mobile'; render(); };
            root.appendChild(toggle);

            // Header
            const header = document.createElement('header');
            header.className = 'header';
            header.innerHTML = `
                <div class="container">
                    <div class="header-content">
                        <div class="logo">
                            <div class="logo-icon">A</div>
                            <div class="logo-text">
                                <h2>AFAN Learning</h2>
                                <p>Protección de Datos</p>
                            </div>
                        </div>
                        <div class="nav">
                            <button class="nav-btn ${state.currentPage === 'inicio' ? 'active' : ''}">Inicio</button>
                            <button class="nav-btn ${state.currentPage === 'cursos' ? 'active' : ''}">Mis Cursos</button>
                            <button class="nav-btn ${state.currentPage === 'examen' ? 'active' : ''}">Examen</button>
                        </div>
                        <div class="user-profile">
                            <div class="user-avatar">FA</div>
                            <div class="user-info">
                                <h3>Felipe Aldunate</h3>
                                <p>faldunate@gmail.com</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            header.querySelectorAll('.nav-btn')[0].onclick = () => { state.currentPage = 'inicio'; render(); };
            header.querySelectorAll('.nav-btn')[1].onclick = () => { state.currentPage = 'cursos'; render(); };
            header.querySelectorAll('.nav-btn')[2].onclick = () => { state.currentPage = 'examen'; render(); };
            root.appendChild(header);

            // Main content
            const main = document.createElement('main');
            main.className = 'main-content';
            const container = document.createElement('div');
            container.className = 'container';

            if (state.currentPage === 'inicio') {
                container.innerHTML = `
                    <div class="hero">
                        <div class="hero-content">
                            <div>
                                <h1>Ley de Protección de Datos Personales</h1>
                                <p>Ley 21.719</p>
                                <p>Domina el marco legal chileno de protección de datos con nuestro programa de capacitación certificado</p>
                                <button class="btn-primary">Comenzar Ahora →</button>
                            </div>
                            <div class="hero-grid">
                                <div class="hero-card">
                                    <div class="hero-card-icon">⏱️</div>
                                    <h3>95 minutos</h3>
                                    <p>de contenido</p>
                                </div>
                                <div class="hero-card">
                                    <div class="hero-card-icon">🏆</div>
                                    <h3>Certificado</h3>
                                    <p>digital</p>
                                </div>
                                <div class="hero-card">
                                    <div class="hero-card-icon">✓</div>
                                    <h3>5 Módulos</h3>
                                    <p>estructurados</p>
                                </div>
                                <div class="hero-card">
                                    <div class="hero-card-icon">🌐</div>
                                    <h3>100% Online</h3>
                                    <p>a tu ritmo</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.querySelector('.btn-primary').onclick = () => { state.currentPage = 'cursos'; render(); };
            } else if (state.currentPage === 'cursos') {
                container.innerHTML = `
                    <h2 style="font-size: 28px; margin-bottom: 8px;">Mis Cursos</h2>
                    <p style="color: #64748b; margin-bottom: 32px;">Completa todos los módulos para acceder al examen final</p>

                    <div class="progress-card">
                        <div class="progress-header">
                            <span>Progreso General</span>
                            <span class="progress-percent">${Math.round(progressPercentage)}%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progressPercentage}%"></div>
                        </div>
                        <div class="progress-text">${state.completedModules.length} de ${modules.length} módulos completados</div>
                    </div>

                    <div class="modules-grid" id="modules-grid"></div>

                    ${state.completedModules.length === modules.length ? `
                        <div style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; padding: 32px; border-radius: 16px; text-align: center; margin-top: 40px;">
                            <p style="margin-bottom: 16px; font-size: 16px;">¡Felicidades! Has completado todos los módulos</p>
                            <button class="btn-primary" style="background: white; color: #10b981; width: auto;">Realizar Examen Final →</button>
                        </div>
                    ` : ''}
                `;

                const modulesGrid = container.querySelector('#modules-grid');
                modules.forEach(module => {
                    const card = document.createElement('div');
                    card.className = `module-card ${state.completedModules.includes(module.id) ? 'completed' : ''}`;
                    card.innerHTML = `
                        <div class="module-header">
                            <div class="module-icon-title">
                                <div class="module-icon">${module.icon}</div>
                                <div class="module-title-section">
                                    <h3>${module.title}</h3>
                                    <div class="module-time">⏱️ ${module.duration}</div>
                                </div>
                            </div>
                            ${state.completedModules.includes(module.id) ? '<div class="checkmark">✓</div>' : ''}
                        </div>
                        <div class="module-desc">${module.content}</div>
                        <div class="module-action">
                            ${!state.completedModules.includes(module.id) ?
                                `<button class="btn-secondary">Ver Módulo →</button>` :
                                `<span class="completed-badge">✓ Completado</span>`
                            }
                        </div>
                    `;
                    if (!state.completedModules.includes(module.id)) {
                        card.querySelector('.btn-secondary').onclick = () => handleCompleteModule(module.id);
                    }
                    modulesGrid.appendChild(card);
                });

                if (state.completedModules.length === modules.length) {
                    container.querySelector('button[style*="white"]').onclick = () => { state.currentPage = 'examen'; render(); };
                }
            } else if (state.currentPage === 'examen' && !state.examSubmitted) {
                container.innerHTML = `
                    <div class="progress-card">
                        <h2 style="margin-bottom: 8px;">Examen Final</h2>
                        <p>Responde correctamente al menos 4 de 5 preguntas (80%) para aprobar</p>
                    </div>
                    <div style="margin-bottom: 32px;" id="exam-questions"></div>
                    <div class="btn-group">
                        <button class="btn-gray">← Volver</button>
                        <button class="btn-secondary" ${answeredCount < 5 ? 'disabled' : ''} style="opacity: ${answeredCount < 5 ? 0.5 : 1}">Enviar Examen →</button>
                    </div>
                `;

                const examQuestionsDiv = container.querySelector('#exam-questions');
                examQuestions.forEach((q, idx) => {
                    const card = document.createElement('div');
                    card.className = `exam-card ${Object.keys(state.examAnswers).includes(String(q.id)) ? 'active' : ''}`;
                    card.innerHTML = `
                        <div class="exam-question">${idx + 1}. ${q.question}</div>
                        <div class="exam-options" id="options-${q.id}"></div>
                    `;
                    const optionsDiv = card.querySelector(`#options-${q.id}`);
                    q.options.forEach((option, optIdx) => {
                        const label = document.createElement('label');
                        label.className = `option-label ${state.examAnswers[q.id] === optIdx ? 'selected' : ''}`;
                        label.innerHTML = `
                            <input type="radio" name="q${q.id}" value="${optIdx}" ${state.examAnswers[q.id] === optIdx ? 'checked' : ''}>
                            <span>${option}</span>
                        `;
                        label.querySelector('input').onchange = () => { handleExamAnswer(q.id, optIdx); };
                        optionsDiv.appendChild(label);
                    });
                    examQuestionsDiv.appendChild(card);
                });

                container.querySelector('.btn-gray').onclick = () => { state.currentPage = 'cursos'; render(); };
                container.querySelector('.btn-secondary').onclick = () => handleSubmitExam();
            } else if (state.currentPage === 'examen' && state.examSubmitted) {
                container.innerHTML = `
                    <div class="result-container ${isPassed ? 'result-passed' : 'result-failed'}" style="border-radius: 16px; margin-bottom: 40px;">
                        <div class="result-icon">${isPassed ? '🎉' : '📋'}</div>
                        <h1 class="result-title">${isPassed ? '¡Aprobado!' : 'No Aprobado'}</h1>
                        <div class="result-score">${state.examScore} de 5 preguntas correctas (${Math.round((state.examScore/5)*100)}%)</div>
                    </div>

                    ${isPassed ? `
                        <div class="certificate">
                            <div class="cert-icon">🏆</div>
                            <h2 class="cert-title">Certificado de Aprobación</h2>
                            <p class="cert-subtitle">Ley de Protección de Datos Personales 21.719</p>
                            <div class="cert-content">
                                <div class="cert-name">Felipe Aldunate</div>
                                <div class="cert-email">faldunate@gmail.com</div>
                                <div class="cert-achievement">
                                    <p>Ha completado exitosamente el curso de</p>
                                    <p style="font-weight: 600;">Ley de Protección de Datos Personales - Ley 21.719</p>
                                </div>
                                <div class="cert-date">
                                    <p>Emitido: ${new Date().toLocaleDateString('es-CL')}</p>
                                    <p style="font-size: 11px; margin-top: 4px;">ID: CERT-${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}${String(new Date().getDate()).padStart(2, '0')}-001</p>
                                </div>
                            </div>
                            <button class="btn-secondary" style="width: 100%; margin-bottom: 16px;">📥 Descargar Certificado PDF</button>
                        </div>
                    ` : ''}

                    <div class="btn-group">
                        <button class="btn-gray" style="flex: 1;">← Volver al Inicio</button>
                        <button class="btn-gray" style="flex: 1;">↩️ Volver a Cursos</button>
                    </div>
                `;

                container.querySelectorAll('.btn-gray')[0].onclick = () => {
                    state.currentPage = 'inicio';
                    state.completedModules = [];
                    state.examAnswers = {};
                    state.examSubmitted = false;
                    render();
                };
                container.querySelectorAll('.btn-gray')[1].onclick = () => {
                    window.location.href = 'index.html';
                };
            }

            main.appendChild(container);
            root.appendChild(main);
        }

        // Initial render when page loads
        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
